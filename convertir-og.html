        function dibujar() {
            var W = 1920, H = 1080;
            canvas.width = W; canvas.height = H;
            ctx.fillStyle = '#1A1A1A'; ctx.fillRect(0, 0, W, H);
            var grad = ctx.createRadialGradient(W*0.35, H*0.3, 0, W*0.35, H*0.3, 600);
            grad.addColorStop(0, 'rgba(255,184,0,0.04)'); grad.addColorStop(1, 'rgba(26,26,26,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#FFB800'; ctx.fillRect(120, 240, 60, 5);
            ctx.fillStyle = '#FFFFFF'; ctx.font = '800 72px system-ui'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
            ctx.fillText('Recursos Academicos', 120, 280);
            ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '400 38px system-ui';
            ctx.fillText('Sede San Joaquin', 120, 375);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '400 26px system-ui';
            var links = ['->  Mallas Curriculares','->  Practicas','->  Como hacer una solicitud en linea','->  Sitio Web DuocUC'];
            for (var i = 0; i < links.length; i++) { ctx.fillText(links[i], 140, 460 + i * 44); }
            ctx.fillStyle = '#FFB800'; ctx.font = '600 22px system-ui';
            ctx.fillText('sanjoaquintools.github.io/recursosacademicos', 120, 720);
            var qrBoxSize = 380, qrBoxX = W - qrBoxSize - 160, qrBoxY = (H - qrBoxSize - 40) / 2;
            ctx.fillStyle = '#FFFFFF'; roundRect(ctx, qrBoxX, qrBoxY, qrBoxSize, qrBoxSize, 20); ctx.fill();
            var qrP = 30, qrS = qrBoxSize - qrP * 2;
            ctx.drawImage(qrImg, qrBoxX + qrP, qrBoxY + qrP, qrS, qrS);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '500 18px system-ui'; ctx.textAlign = 'center';
            ctx.fillText('Escanea el codigo QR para acceder', qrBoxX + qrBoxSize / 2, qrBoxY + qrBoxSize + 35);
            ctx.textAlign = 'left';
            ctx.fillStyle = '#FFB800'; ctx.fillRect(0, H - 16, W, 16);
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '400 16px system-ui';
            ctx.fillText('Sede San Joaquin - Recursos Academicos - 2026', 120, H - 50);
            document.getElementById('status').textContent = 'Imagen lista para descargar';
        }
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
            ctx.quadraticCurveTo(x+w, y, x+w, y+r); ctx.lineTo(x+w, y+h-r);
            ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
            ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r);
            ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
        }
